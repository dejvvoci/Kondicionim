version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Versionet major (Angular, TypeScript, Vitest) përditësohen me dorë me `ng update`.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint', '@angular-eslint/*']
      dev-tools:
        dependency-type: development
        exclude-patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint', '@angular-eslint/*']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
