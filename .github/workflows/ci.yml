name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # Build-i i prodhimit (prerender + 404 + sitemap + kontrolli i lidhjeve dhe buxheteve).
      - run: npm run build

      # Testet mbi build-in e testeve (numra fiktivë kontakti, dist/e2e).
      - run: npm run build:e2e
      - name: Instalo Chromium për Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E + axe (celular 390px dhe desktop 1280px)
        run: npm run e2e
      - name: Lighthouse CI (buxhetet e seksionit 6.2)
        run: npm run lighthouse
      - name: Rezultatet e Lighthouse në përmbledhje
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Raportet e testeve
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: raportet
          path: |
            playwright-report/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      # Deploy në Cloudflare Pages: main → prodhim, çdo PR → preview me URL të vetën.
      # Kalohet nëse sekretet CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID nuk janë vendosur.
      - name: Deploy në Cloudflare Pages
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/kondicionim/browser --project-name=kondicionim --branch=${{ github.head_ref || github.ref_name }}

      - name: URL-ja e preview-t
        if: steps.deploy.outcome == 'success'
        run: |
          echo "Deploy-i: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
