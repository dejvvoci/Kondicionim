<header class="header">
  <div class="container header__inner">
    <a class="header__logo" routerLink="/" [attr.aria-label]="name + ' – ' + t.nav.home">
      <img
        class="header__logo-img"
        src="/images/logo/logo-header.webp"
        alt=""
        width="212"
        height="52"
        fetchpriority="high"
      />
    </a>

    <nav class="header__nav" id="main-nav" [attr.aria-label]="t.nav.label">
      <ul class="header__list">
        @for (item of nav; track item.path) {
          <li>
            <a
              class="header__link"
              [routerLink]="item.path"
              routerLinkActive="is-active"
              ariaCurrentWhenActive="page"
              >{{ item.label }}</a
            >
          </li>
        }
      </ul>
    </nav>

    <div class="header__actions">
      @if (phoneHref) {
        <a
          ui-button
          variant="primary"
          class="header__call"
          [href]="phoneHref"
          appTrackPhone="header"
        >
          <ui-icon name="phone" [size]="20" />
          <span>{{ phoneLabel }}</span>
        </a>
      } @else if (showTodo) {
        <span class="header__call todo">TODO: telefoni</span>
      }
    </div>
  </div>
</header>
