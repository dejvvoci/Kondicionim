<header class="page-head">
  <div class="container">
    <ui-breadcrumbs [items]="crumbs" />
    <span class="eyebrow">{{ t.eyebrow }}</span>
    <h1>{{ t.title }}</h1>
    <p class="lead">{{ t.lead }}</p>
  </div>
</header>

<ui-section tone="soft" [narrow]="true">
  <section class="group" aria-labelledby="faq-pergjithshme">
    <h2 id="faq-pergjithshme">{{ t.general }}</h2>
    <ui-accordion>
      @for (f of general; track f.q) {
        <ui-accordion-item [title]="f.q">
          <p>{{ f.a }}</p>
        </ui-accordion-item>
      }
    </ui-accordion>
  </section>

  @for (s of byService; track s.slug) {
    <section class="group" [attr.aria-labelledby]="'faq-' + s.slug">
      <h2 [id]="'faq-' + s.slug">{{ s.title }}</h2>
      <ui-accordion>
        @for (f of s.faq; track f.q) {
          <ui-accordion-item [title]="f.q">
            <p>{{ f.a }}</p>
          </ui-accordion-item>
        }
      </ui-accordion>
      <a ui-button variant="link" class="group__link" [routerLink]="'/sherbimet/' + s.slug">
        {{ t.aboutService }}<span class="visually-hidden">: {{ s.title }}</span>
      </a>
    </section>
  }
</ui-section>

@if (flow.available) {
  <ui-section tone="base" [title]="t.ctaTitle" [lead]="t.ctaLead">
    <button ui-button variant="primary" size="lg" type="button" (click)="openWhatsApp()">
      <ui-icon name="brand-whatsapp" [size]="22" />{{ contact.whatsapp }}
    </button>
  </ui-section>
}
